<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo decorativo -->
  <rect x="5" y="5" width="190" height="50" rx="10" fill="#F5F5DC" stroke="#8B4513" stroke-width="2"/>
  
  <!-- Texto "Pitea" -->
  <text x="40" y="40" font-family="'Playfair Display', serif" font-size="32" font-weight="700" fill="#8B4513">
    Pitea
  </text>
  
  <!-- Número "2" -->
  <text x="130" y="40" font-family="'Playfair Display', serif" font-size="32" font-weight="700" fill="#DAA520">
    2
  </text>
  
  <!-- Elemento decorativo: línea piteada -->
  <path d="M25,45 L175,45" stroke="#C0C0C0" stroke-width="3" stroke-linecap="round" stroke-dasharray="1,3"/>
  
  <!-- Pequeños elementos decorativos piteados -->
  <circle cx="25" cy="20" r="3" fill="#C0C0C0"/>
  <circle cx="175" cy="20" r="3" fill="#C0C0C0"/>
  <circle cx="35" cy="50" r="2" fill="#DAA520"/>
  <circle cx="165" cy="50" r="2" fill="#DAA520"/>
</svg> 