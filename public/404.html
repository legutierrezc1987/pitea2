<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pitea2 - Artesanía Piteada de Lujo</title>
    <script type="text/javascript">
      // Redireccionar a la página principal para que React Router pueda manejar las rutas
      var pathSegmentsToKeep = 0;
      
      var l = window.location;
      var redirectUrl =
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;

      window.location.replace(redirectUrl);
    </script>
  </head>
  <body>
    <h1>Redireccionando...</h1>
    <p>Si no eres redirigido automáticamente, <a href="https://pitea2.us/">haz clic aquí</a>.</p>
  </body>
</html>
